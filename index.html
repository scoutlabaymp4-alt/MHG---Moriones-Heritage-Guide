<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moriones Heritage Guide</title>
  <meta name="description" content="A bilingual learning and visitor companion for the Moryonan of Marinduque. Student project, MarSU.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1b1410">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Moriones Heritage Guide">
  <meta property="og:description" content="A bilingual (English/Filipino) learning and visitor companion for the Moryonan of Marinduque. Student project, MarSU.">
  <meta property="og:site_name" content="MHG">
  <meta name="twitter:card" content="summary">
  <!-- After the site is live, add this line (use your real address) so shared links show a picture:
       <meta property="og:image" content="https://YOUR-LIVE-ADDRESS/assets/og-card.png"> and change twitter:card to summary_large_image -->
  <link rel="icon" href="assets/logo/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main" id="skip"></a>

  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="brand" href="#/learn/legend">
        <img class="brand-logo" src="assets/logo/mhg-logo-128.png" alt="" width="101" height="128">
        <span class="brand-text">
          <span id="siteTitle" class="brand-title">Moriones Heritage Guide</span>
          <span id="siteTagline" class="brand-tag"></span>
        </span>
      </a>
      <nav aria-label="Main">
        <ul class="nav" id="nav"></ul>
      </nav>
      <div class="lang" role="group" aria-labelledby="langLabel">
        <span id="langLabel" class="visually-hidden">Language</span>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang-btn" data-lang="fil" aria-pressed="false">FIL</button>
      </div>
    </div>
  </header>

  <aside class="notice">
    <div class="wrap" id="notice"></div>
  </aside>

  <main id="main" class="wrap" tabindex="-1">
    <p id="loading">Loading…</p>
    <noscript><p class="error">This guide needs JavaScript to run. Please turn it on in your browser. / Kailangan ng JavaScript ang gabay na ito. Paki-on ito sa iyong browser.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <!-- data/content.js is a generated copy of content.json, loaded by app.js only when the page is opened from disk (file://) -->
  <script src="js/app.js"></script>
</body>
</html>
